name: aiops-lab

x-hadoop: &hadoop
  image: apache/hadoop:3.3.6
  user: "0:0"
  restart: "no"
  environment:
    HADOOP_HEAPSIZE: "512"
  volumes:
    - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
    - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
    - ./bin:/lab/bin:ro
    - ./inject:/lab/inject:ro
  networks: [hdfs]

services:
  lab-init:
    image: alpine:3.20
    command: ["/bin/sh", "-c", "apk add --no-cache e2fsprogs >/dev/null && dd if=/dev/zero of=/data/data.img bs=1M count=64 status=none && mkfs.ext4 -q -F /data/data.img"]
    volumes:
      - dn1-data:/data

  namenode:
    <<: *hadoop
    container_name: aiops-lab-namenode
    hostname: namenode
    command: ["/bin/bash", "/lab/bin/start-namenode.sh"]
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./bin:/lab/bin:ro
      - ./inject:/lab/inject:ro
      - namenode-data:/tmp/hadoop-root/dfs/name
    ports:
      - "9870:9870"
      - "9000:9000"

  datanode1:
    <<: *hadoop
    container_name: aiops-lab-dn1
    hostname: datanode1
    privileged: true
    environment:
      HADOOP_HEAPSIZE: "512"
      HADOOP_LOG_DIR: /tmp/logs
    command: ["/bin/bash", "/lab/bin/start-datanode-loop.sh"]
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./bin:/lab/bin:ro
      - ./inject:/lab/inject:ro
      - dn1-data:/data
    depends_on:
      lab-init:
        condition: service_completed_successfully

  datanode2:
    <<: *hadoop
    container_name: aiops-lab-dn2
    hostname: datanode2
    command: ["/bin/bash", "/lab/bin/start-datanode.sh"]
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./bin:/lab/bin:ro
      - ./inject:/lab/inject:ro
      - dn2-data:/tmp/hadoop-root/dfs/data

  datanode3:
    <<: *hadoop
    container_name: aiops-lab-dn3
    hostname: datanode3
    command: ["/bin/bash", "/lab/bin/start-datanode.sh"]
    volumes:
      - ./conf/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./conf/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ./bin:/lab/bin:ro
      - ./inject:/lab/inject:ro
      - dn3-data:/tmp/hadoop-root/dfs/data

networks:
  hdfs:
    driver: bridge

volumes:
  namenode-data:
  dn1-data:
  dn2-data:
  dn3-data:
