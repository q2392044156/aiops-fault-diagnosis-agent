schema_version: 5
detector:
  threshold: 0.6
  min_lines: 1
retrieval_config: resources/configs/retrieval.yaml
rag_config: resources/configs/rag.yaml
agent_config: resources/configs/agent.yaml
server:
  host: 127.0.0.1
  port: 8000
  workers: 1
upload:
  max_bytes: 268435456
  chunk_bytes: 1048576
processing:
  max_line_bytes: 1048576
  parquet_batch_rows: 10000
  inference_batch_sessions: 2048
  event_max_gap_seconds: 300
  event_max_span_seconds: 1800
worker:
  poll_seconds: 0.2
  heartbeat_seconds: 5
  heartbeat_max_age_seconds: 15
  lease_seconds: 30
  queue_capacity: 32
  agent_queue_capacity: 16
ui:
  api_url: http://127.0.0.1:8000
  refresh_seconds: 2
paths:
  runtime_dir: runtime
  database: runtime/service.sqlite3
registered_batches: {}

