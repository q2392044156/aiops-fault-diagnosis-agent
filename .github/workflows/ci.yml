name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-framework-lock.txt
          python -m pip install -e ".[dev]" --no-deps
          python -m pip check

      - name: Run tests
        run: python -m pytest -q --basetemp=.pytest-tmp

      - name: Validate project structure
        run: python ops/scripts/validate_project_structure.py

      - name: Offline end-to-end demo
        run: python demo/run_demo.py --json
