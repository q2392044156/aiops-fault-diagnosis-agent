[project]
name = "aiops-fault-diagnosis-agent"
version = "1.2.0rc1"
description = "Reproducible HDFS data pipeline for an AIOps research prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "drain3==0.9.11",
    "httpx>=0.28,<1",
    "jieba==0.42.1",
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "onnxruntime>=1.31,<2",
    "psutil>=6,<8",
    "pydantic>=2.14,<3",
    "pyarrow>=18,<24",
    "python-multipart>=0.0.32,<1",
    "PyYAML>=6,<7",
    "scikit-learn>=1.6,<2",
    "streamlit>=1.50,<2",
    "tokenizers>=0.22,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = ["mypy==2.4.1", "pytest>=8,<10", "ruff==0.17.5"]
framework = [
    "langchain-core==1.6.12",
    "langgraph==1.2.16",
]
research = [
    "hf-xet==1.7.0",
    "huggingface-hub==0.36.2",
    "onnx==1.23.2",
    "optimum-onnx==0.1.0",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "transformers==4.57.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_diag", "src/offline", "src/evaluation", "src/online"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests", "ops", "demo"]
extend-exclude = ["artifacts", "resources", "documentation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "T201"]
ignore = ["E501", "E701", "E702"]

[tool.ruff.lint.per-file-ignores]
"**/__main__.py" = ["T201"]
"demo/*" = ["T201", "E402"]
"ops/**" = ["T201", "B008", "E402"]
# 这些模块的 print 是 CLI 结果输出（JSON/进度），属于对外接口，不是调试残留
"src/evaluation/agent/cases.py" = ["T201"]
"src/evaluation/agent/legacy.py" = ["T201"]
"src/evaluation/agent/online.py" = ["T201"]
"src/evaluation/agent/taxonomy.py" = ["T201"]
"src/evaluation/retrieval/blind.py" = ["T201"]
"src/evaluation/retrieval/freeze.py" = ["T201"]
"src/evaluation/retrieval/pool.py" = ["T201"]
"src/evaluation/retrieval/review.py" = ["T201"]
"src/evaluation/retrieval/runbook.py" = ["T201"]
"src/offline/detection/mining.py" = ["T201"]
"src/offline/ingestion/download.py" = ["T201"]
"src/offline/ingestion/pipeline.py" = ["T201"]
"src/online/diagnosis/framework/release.py" = ["T201"]
"src/online/diagnosis/release_candidate.py" = ["T201"]
"src/online/knowledge/gate.py" = ["T201"]
"src/online/knowledge/protocol.py" = ["T201"]
# FastAPI 的 File(...)/Header(...) 默认值是框架要求的写法
"src/aiops_diag/platform/api.py" = ["B008"]
# 这两个文件在 pytest.importorskip("torch") 之后才导入被测模块，顺序不可调
"tests/test_lstm.py" = ["E402"]
"tests/test_selection.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".test-cache"

[tool.mypy]
python_version = "3.11"
files = [
    "src/aiops_diag/common.py",
    "src/aiops_diag/nodes.py",
    "src/aiops_diag/constants.py",
    "src/aiops_diag/platform/db.py",
    "src/online/knowledge/gate.py",
    "src/online/knowledge/protocol.py",
]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
