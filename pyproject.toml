[project]
name = "aiops-fault-diagnosis-agent"
version = "0.1.0"
description = "Reproducible HDFS data pipeline for an AIOps research prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "drain3==0.9.11",
    "httpx>=0.28,<1",
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "psutil>=6,<8",
    "pydantic>=2.14,<3",
    "pyarrow>=18,<24",
    "python-multipart>=0.0.32,<1",
    "PyYAML>=6,<7",
    "scikit-learn>=1.6,<2",
    "streamlit>=1.50,<2",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
research = ["torch==2.14.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
