[project]
name = "aiops-fault-diagnosis-agent"
version = "0.1.0"
description = "Reproducible HDFS data pipeline for an AIOps research prototype"
requires-python = ">=3.11,<3.12"
dependencies = ["pyarrow>=18,<24", "PyYAML>=6,<7", "psutil>=6,<8"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_cache/tmp"
