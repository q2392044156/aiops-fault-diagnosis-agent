[project]
name = "aiops-fault-diagnosis-agent"
version = "0.1.0"
description = "Reproducible HDFS data pipeline for an AIOps research prototype"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.143,<1",
    "drain3==0.9.11",
    "httpx>=0.28,<1",
    "jieba==0.42.1",
    "joblib>=1.4,<2",
    "numpy>=2,<3",
    "onnxruntime>=1.31,<2",
    "psutil>=6,<8",
    "pydantic>=2.14,<3",
    "pyarrow>=18,<24",
    "python-multipart>=0.0.32,<1",
    "PyYAML>=6,<7",
    "scikit-learn>=1.6,<2",
    "streamlit>=1.50,<2",
    "tokenizers>=0.22,<1",
    "uvicorn>=0.54,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
research = [
    "hf-xet==1.7.0",
    "huggingface-hub==0.36.2",
    "onnx==1.23.2",
    "optimum-onnx==0.1.0",
    "safetensors==0.8.0",
    "torch==2.14.1",
    "transformers==4.57.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_diag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".test-cache"
